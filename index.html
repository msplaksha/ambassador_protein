<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive lessons on the AI era of biology for Class 11: DNA, protein structures, drug design with ChEMBL, machine learning and CRISPR.">
<title>AI Era of Biology</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky progress header, step rail, one module at a time; teacher dashboard is a separate view.
   Palette: lab green (brand), coral (hands-on), base-pair colours for DNA letters. Type: Fraunces / Public Sans / IBM Plex Mono. */
:root {
  --bg: #F2F7F4; --surface: #FFFFFF; --surface2: #E6F0EA; --ink: #0D2924; --muted: #4A675F; --line: #D3E2DA;
  --brand: #0E7A5F; --brand-ink: #FFFFFF; --brand-soft: #D8F0E6;
  --accent: #D2431F; --accent-soft: #FBE5DE; --accent-ink: #FFFFFF;
  --ok: #17803F; --ok-soft: #DCF3E3; --bad: #B3261E; --bad-soft: #FADFDC;
  --nA: #2D6AD8; --nT: #B97C06; --nG: #0E7A5F; --nC: #B8362A;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1A17; --surface: #11292A; --surface2: #173733; --ink: #E5F2EC; --muted: #9ABBB0; --line: #25463F;
  --brand: #3FC79F; --brand-ink: #06231C; --brand-soft: #14423A;
  --accent: #FF7A5C; --accent-soft: #3A2320; --accent-ink: #2A0E07;
  --ok: #55D487; --ok-soft: #12391F; --bad: #FF8E86; --bad-soft: #3D1E1C;
  --nA: #7BA6FF; --nT: #F0B84A; --nG: #3FC79F; --nC: #FF8C7E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A1A17; --surface: #11292A; --surface2: #173733; --ink: #E5F2EC; --muted: #9ABBB0; --line: #25463F;
  --brand: #3FC79F; --brand-ink: #06231C; --brand-soft: #14423A;
  --accent: #FF7A5C; --accent-soft: #3A2320; --accent-ink: #2A0E07;
  --ok: #55D487; --ok-soft: #12391F; --bad: #FF8E86; --bad-soft: #3D1E1C;
  --nA: #7BA6FF; --nT: #F0B84A; --nG: #3FC79F; --nC: #FF8C7E; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 920px; margin-inline: auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; color: var(--brand); }
.meters { display: flex; gap: 14px; align-items: center; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
.meter { display: flex; align-items: center; gap: 8px; }
.meter b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { width: 84px; height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.save { font-size: .78rem; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.save.err { background: var(--bad-soft); color: var(--bad); }
.rail { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px 2px; scrollbar-width: thin; }
.rail button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .85rem; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.rail button[aria-current="step"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rail .dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); }
.rail .dot.on { background: var(--ok); border-color: var(--ok); }
.rail .dot.half { border-color: var(--ok); background: linear-gradient(90deg, var(--ok) 50%, transparent 50%); }
.rail .teach { border-style: dashed; }

/* sections */
main { padding-block: 22px; display: grid; gap: 18px; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.title { font-size: clamp(1.7rem, 4.6vw, 2.5rem); }
.lead { color: var(--muted); max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.learn { display: grid; gap: 12px; }
.learn h3 { font-size: 1.25rem; }
.learn p { max-width: 65ch; }
.callout { background: var(--brand-soft); border-radius: 10px; padding: 12px 14px; font-size: .95rem; }
.callout.warn { background: var(--accent-soft); }
.terms { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.terms li { background: var(--surface2); border-radius: 8px; padding: 6px 10px; font-size: .88rem; max-width: 100%; }
.terms b { font-weight: 700; }
.steps { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mini { background: var(--surface2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 4px; font-size: .95rem; }
.mini p { font-size: .9rem; color: var(--muted); }

/* cost chart */
.cost { display: grid; gap: 8px; }
.cost-row { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; font-size: .88rem; }
.cost-bar { background: var(--surface2); border-radius: 6px; height: 28px; position: relative; }
.cost-bar i { display: block; height: 100%; border-radius: 6px; background: var(--brand); }
.cost-bar span { position: absolute; left: 10px; top: 0; bottom: 0; display: flex; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--brand-ink); }
.cost-bar.short span { color: var(--ink); left: calc(var(--w) + 8px); }
.cost-note { font-size: .8rem; color: var(--muted); }

/* questions */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.q-tag { font-size: .75rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.q h3 { font-size: 1.1rem; font-family: var(--f-body); font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt .k { font-family: var(--f-mono); font-weight: 600; width: 22px; flex: 0 0 22px; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .mark { margin-left: auto; font-weight: 700; flex: 0 0 auto; }
.why { font-size: .93rem; background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
.why b.ok { color: var(--ok); } .why b.no { color: var(--bad); }

/* activities */
.act { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.act-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; }
.pill.done { background: var(--ok); color: var(--brand-ink); }
.act h3 { font-size: 1.35rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1.5px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.coral { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
a.btn { text-decoration: none; display: inline-block; color: inherit; }
a.btn.primary { color: var(--brand-ink); }
label.fld { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
input[type=text], select, textarea { font: inherit; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
.hint { font-size: .85rem; color: var(--muted); }
.feedback { border-radius: 10px; padding: 10px 12px; font-size: .94rem; }
.feedback.ok { background: var(--ok-soft); } .feedback.no { background: var(--bad-soft); } .feedback.info { background: var(--surface2); }

/* DNA tiles */
.tiles { display: flex; gap: 4px; flex-wrap: wrap; }
.tile { font-family: var(--f-mono); font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 0; width: 54px; text-align: center; }
button.tile:hover { border-color: var(--brand); }
.tile.sel { border-color: var(--accent); background: var(--accent-soft); outline: 2px solid var(--accent); }
.tile.hit { border-color: var(--ok); background: var(--ok-soft); }
.rowlabel { font-size: .85rem; font-weight: 600; color: var(--muted); margin-block: 6px 4px; }
.strip { overflow-x: auto; padding-bottom: 6px; }
.dna { display: grid; grid-template-columns: repeat(21, 26px); gap: 2px; width: max-content; }
.base { font-family: var(--f-mono); font-weight: 600; text-align: center; border-radius: 5px; padding: 5px 0; font-size: .9rem; border: 1.5px solid transparent; }
.base.A { color: var(--nA); } .base.T { color: var(--nT); } .base.G { color: var(--nG); } .base.C { color: var(--nC); }
.dna .base { background: var(--surface); border-color: var(--line); }
.guide .base { background: var(--accent); color: var(--accent-ink); }
.guide .base.ok { background: var(--ok); color: var(--brand-ink); }
.guide .base.no { background: var(--bad); color: var(--brand-ink); }
.cutline { font-family: var(--f-mono); font-weight: 600; word-break: break-all; }
.cutline .gap { display: inline-block; width: 18px; }
input[type=range] { width: min(100%, 420px); accent-color: var(--accent); }
.corner { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.corner button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 8px; font-weight: 600; }
.corner button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }

/* nav + welcome */
.foot { display: flex; justify-content: center; padding-top: 6px; }
.btn.sm { padding: 5px 10px; font-size: .85rem; border-width: 1px; }
.pager { display: flex; justify-content: space-between; gap: 10px; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.welcome { max-width: 560px; margin-inline: auto; display: grid; gap: 16px; padding-block: 20px; }
.finish { background: var(--brand); color: var(--brand-ink); border-radius: 14px; padding: 20px; display: grid; gap: 6px; }
.finish h3 { font-size: 1.5rem; }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-family: var(--f-display); font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .85rem; color: var(--muted); }
.hbars { display: grid; gap: 8px; }
.hb { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 74px; gap: 10px; align-items: center; font-size: .9rem; }
.hb .lab { min-width: 0; }
.hb .lab small { display: block; color: var(--muted); font-size: .78rem; }
.hb .track { height: 14px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.hb .track i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.hb .track i.low { background: var(--accent); }
.hb .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 560px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tick { color: var(--ok); font-weight: 700; } .dash { color: var(--muted); }
.resp { display: grid; gap: 8px; }
.resp blockquote { margin: 0; padding: 8px 12px; background: var(--surface2); border-radius: 8px; font-size: .9rem; overflow-wrap: anywhere; }
.resp blockquote small { color: var(--muted); display: block; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-h h3 { font-size: 1.2rem; }
@media (max-width: 520px) { .hb { grid-template-columns: 1fr 64px; } .hb .track { grid-column: 1 / -1; order: 3; } .tile { width: 40px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.fig { margin: 4px 0; } .fig img { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
.fig figcaption { font-size: .85rem; color: var(--muted); margin-top: 4px; }
.sgrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; } .sgmk { font-weight: 700; font-size: .9rem; padding-bottom: 10px; min-width: 90px; } .sgmk.ok { color: var(--ok); } .sgmk.no { color: var(--bad); }
.mol { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.mol-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; } .mol-h span { color: var(--muted); font-size: .9rem; }
.nums { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--f-mono); font-size: .92rem; }
.sliders { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); } input[type=range] { width: 100%; accent-color: var(--accent); }
.dksvg, .trsvg { width: 100%; max-width: 460px; height: auto; display: block; margin-inline: auto; }
.dkpocket { fill: var(--surface2); stroke: var(--line); stroke-width: 2; } .dkring { fill: var(--ink); fill-opacity: .15; stroke: var(--ink); stroke-width: 2; } .dkbond { stroke: var(--ink); stroke-width: 2; }
.dk-none { fill: var(--surface); stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; } .dk-good { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 3; } .dk-mid { fill: #FBE9BD; stroke: #B97C06; stroke-width: 3; } .dk-bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 3; }
.dklab { font-family: var(--f-mono); font-weight: 600; font-size: 13px; fill: #0D2924; }
.dkmeter { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; } .dkmeter .bar { display: inline-block; width: 160px; height: 10px; background: var(--surface2); border-radius: 6px; overflow: hidden; } .dkmeter .bar i { display: block; height: 100%; background: var(--ok); }
.trbox { fill: var(--surface); stroke: var(--line); } .trhide { fill: var(--surface2); opacity: .8; } .trnote, .trax { font-size: 11px; fill: var(--muted); font-family: var(--f-body); }
.tr-act { fill: var(--brand); stroke: var(--ink); stroke-width: .6; } .tr-ina { fill: var(--accent); stroke: var(--ink); stroke-width: .6; } circle.hid { opacity: .45; }
.trline { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.trleg { display: flex; gap: 16px; justify-content: center; font-size: .85rem; color: var(--muted); } .trleg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.badnum { color: var(--bad); } .trleg { margin-top: 2px; } .trleg i.tr-act { background: var(--brand); } .trleg i.tr-ina { background: var(--accent); }
.pipe { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.seg { display: inline-flex; gap: 6px; flex-wrap: wrap; } .tsign { margin-top: 14px; font-size: .9rem; color: var(--muted); } .tsign summary { cursor: pointer; }
.cbrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; } .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cbcard { display: grid; grid-template-columns: 180px 1fr; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; } .cbimg { width: 100%; height: auto; background: #fff; border-radius: 8px; } .cbbody { display: grid; gap: 6px; } .cbbody h4, .cbh { font-family: var(--f-display); font-size: 1.1rem; margin: 0; } .cbh small { display: block; font-family: var(--f-body); font-size: .82rem; font-weight: 400; color: var(--muted); }
@media (max-width: 520px) { .cbcard { grid-template-columns: 1fr; } .cbrow { grid-template-columns: 1fr; } }
.v3 { display: grid; gap: 10px; } .v3chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--f-mono); font-weight: 600; font-size: .85rem; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; } .chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.v3cv { width: 100%; height: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; touch-action: none; cursor: grab; display: block; } .v3cv:active { cursor: grabbing; }
.v3ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .v3sel, .v3chk { display: flex; gap: 6px; align-items: center; font-size: .9rem; font-weight: 600; } .v3sel select { width: auto; padding: 5px 8px; }
.v3legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); } .v3legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
#v3info h4 { font-family: var(--f-display); font-size: 1.1rem; margin: 4px 0; } #v3info h4 small { font-family: var(--f-mono); color: var(--muted); font-size: .8rem; font-weight: 500; } #v3info p { margin-top: 4px; }
</style>
</head>

<div class="wrap" id="root">
  <div class="top" id="top" hidden></div>
  <main id="main" aria-live="polite"><p class="lead">Loading…</p></main>
</div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  /* ---------------- content ---------------- */
  var ACTS = [
    { id: "poll", label: "Warm-up poll" }, { id: "a1", label: "Be the sequencer" }, { id: "a2", label: "Train an AI" },
    { id: "a3", label: "Explore AlphaFold" }, { id: "a4", label: "Paper CRISPR" }, { id: "a5", label: "Debate" },
    { id: "sg", label: "Match structure levels" }, { id: "exp", label: "Explore structures in 3D" }, { id: "r5", label: "Rule of five" }, { id: "dk", label: "Dock the fragment" }, { id: "cb", label: "ChEMBL lookup" }, { id: "tr", label: "Train the AI (drug data)" }, { id: "exit", label: "Exit ticket" }
  ];
  var Q = {
    p1: { part: "Poll 1 of 3", t: "How long does it usually take to develop one new medicine?", o: ["About 2 years", "About 5 years", "12 to 15 years"], a: 2,
      why: "Developing one new drug the old way takes 12 to 15 years and about $2.6 billion, and roughly 9 in 10 candidates fail on the way." },
    p2: { part: "Poll 2 of 3", t: "How many letters (A, T, G, C) are in one human genome?", o: ["About 3 million", "About 300 million", "About 3.2 billion"], a: 2,
      why: "A human genome has about 3.2 billion letters. That is why computers are needed to read and compare them." },
    p3: { part: "Poll 3 of 3", t: "How long can an AI take to predict a protein's 3D shape?", o: ["Minutes to hours", "Several months", "Several years"], a: 0,
      why: "AlphaFold predicts a shape from the amino acid sequence in minutes to hours. Lab methods like X-ray crystallography can take months or years for one protein." },
    q1: { part: "Check your understanding", t: "Sequencing one genome fell from about $100 million to a few hundred dollars. What is the biggest consequence for biology?", o: ["Genomes became smaller", "There is now far more data than people can analyse by hand, so we need computers and AI", "Scientists no longer need to do experiments", "Every disease was cured"], a: 1,
      why: "Cheaper reading means millions of genomes, each about 200 GB of raw data. Finding patterns in that much data needs bioinformatics and AI. Experiments are still needed to test what the patterns suggest." },
    q2: { part: "Check your understanding", t: "Which sentence best describes machine learning?", o: ["A computer follows a list of rules a person wrote for every case", "A computer finds patterns in many solved examples and uses them to predict new cases", "A computer copies the answer from a textbook", "A computer thinks exactly like a human brain"], a: 1,
      why: "In machine learning you give the computer many labelled examples (training data). It finds the patterns itself, then predicts cases it has not seen before." },
    q3: { part: "Check your understanding", t: "AlphaFold predicts a protein's 3D shape starting from its…", o: ["Amino acid sequence", "Cell membrane", "Colour", "Blood group"], a: 0,
      why: "The amino acid sequence (primary structure) contains the information that decides how the chain folds. AlphaFold learned this link from known structures." },
    qaf: { part: "Activity question", t: "In an AlphaFold model, what do orange regions mean?", o: ["The AI is very confident about this part", "The AI has low confidence about this part", "This part is an alpha helix", "This part is damaged"], a: 1,
      why: "Dark blue means very high confidence and orange means low confidence. Low-confidence parts are often flexible loops with no single fixed shape." },
    q4: { part: "Check your understanding", t: "Which of these is NOT something AI is used for in drug discovery?", o: ["Spotting disease targets in large datasets", "Designing new drug molecules", "Simulating how a molecule behaves before lab tests", "Replacing safety trials in people completely"], a: 3,
      why: "AI helps pick better candidates earlier, but every medicine still needs safety and effectiveness trials (Phase I, II and III) in people." },
    q5: { part: "Check your understanding", t: "What is the job of the guide RNA in CRISPR?", o: ["To cut the DNA", "To match and find the exact DNA sequence to edit", "To make the cell divide", "To copy the whole genome"], a: 1,
      why: "The guide RNA is the 'GPS': it pairs with the matching DNA sequence and brings Cas9 there. Cas9 is the protein that does the cutting." },
    q6: { part: "Check your understanding", t: "A leaf-disease AI was trained only on photos with a white background. It fails on photos taken in a field. What is the best explanation?", o: ["The training data was not varied enough (bias)", "Leaves look different in fields", "The computer was too slow", "AI cannot work with photos"], a: 0,
      why: "The model may have learned 'white background' as a clue. A training set should cover the conditions where the AI will be used. The same problem can affect genome datasets that mostly come from a few populations." }

  Q.s1 = { part: "Check your understanding", t: "Haemoglobin is made of four protein chains that fit together and work as one unit. Which level of structure is this?", o: ["Primary", "Secondary", "Tertiary", "Quaternary"], a: 3,
    why: "Quaternary structure is how two or more folded chains assemble. Primary is the amino acid order, secondary is local helices and sheets, and tertiary is the fold of one whole chain." };
  Q.s2 = { part: "Check your understanding", t: "A drug molecule sits in a pocket on a protein. What does a good fit need?", o: ["Only that the drug is as large as possible", "The right size and shape, with chemical partners facing each other (for example hydrogen-bond donors and acceptors)", "Only that the drug has the same colour as the protein", "Only a positive charge"], a: 1,
    why: "Binding is like a key in a lock: shape and size must match, and groups on the drug must pair up with groups lining the pocket. A bigger molecule is not better, and one feature alone is never enough." };
  Q.d1 = { part: "Check your understanding", t: "A molecule has molecular weight 620, logP 6.1, 3 H-bond donors and 7 H-bond acceptors. How many rule-of-five limits does it break?", o: ["0", "1", "2", "3"], a: 2,
    why: "Molecular weight 620 is over 500 and logP 6.1 is over 5. Donors (3, limit 5) and acceptors (7, limit 10) are fine. So it breaks 2 limits and may be hard to take as a pill." };
  Q.t1 = { part: "Check your understanding", t: "In the AI-learning demo, what does the computer do after it measures how wrong it is?", o: ["It throws away the data", "It adjusts its numbers, so the dividing line moves to reduce the error", "It asks a scientist for the rule", "It stops, because it has finished"], a: 1,
    why: "Learning is a loop: guess, measure the error, adjust the numbers a little, repeat. Nobody types in the rule. The computer finds it by being corrected many times." };
  Q.t2 = { part: "Check your understanding", t: "An AI ranks a molecule as a very promising drug. What is the right next step?", o: ["Give it to patients, because the AI is accurate", "Test it in the lab and then in trials, because a prediction is only a hypothesis", "Ignore it, because AI is never useful", "Skip safety tests to save time"], a: 1,

  function viewProtein() {
    var h = '<article class="card learn"><h3>Sequence, shape, function</h3>' +
      "<p>In Biomolecules you met four levels of protein structure: the <b>amino acid sequence</b> (primary), helices and sheets (secondary), the 3D fold of one chain (tertiary) and several chains together (quaternary). Haemoglobin has four chains.</p>" +
      "<p>A protein works because of its shape. An enzyme's active site fits its substrate like a key fits a lock. Change one amino acid and the shape, and so the function, can change, as in sickle cell disease.</p>" +
      "<p>For about 50 years, predicting the shape from the sequence alone was one of biology's biggest unsolved problems. A chain of only 100 amino acids can fold in an astronomically large number of ways. Labs worked out shapes with X-ray crystallography or cryo-electron microscopy, which could take months or years for one protein.</p>" +
      "<p>In 2020, DeepMind's <b>AlphaFold</b> predicted shapes with accuracy close to experiments, in minutes to hours. Its free database now holds more than 200 million predicted structures. The 2024 Nobel Prize in Chemistry was shared by Demis Hassabis and John Jumper (AlphaFold) and David Baker (designing new proteins by computer).</p>" +
      '<div class="callout">Every AlphaFold structure comes with a <b>confidence score</b>, shown as colours: dark blue is very confident, orange is low confidence. It predicts one shape, so it does not show everything about how a protein moves or binds. Scientists still check results in the lab.</div>' +
      terms([T("Protein folding"), T("AlphaFold")]) + "</article>";
    h += qCard("q3") + a3();
    return h;
  }

  function viewMedicine() {

      '<div class="grid2"><div class="mini"><h4>1. Find the target</h4><p>Reads millions of papers and genome datasets to suggest which protein to aim at.</p></div><div class="mini"><h4>2. Design the molecule</h4><p>Generative AI proposes new molecules that fit the target and look safe.</p></div><div class="mini"><h4>3. Test virtually</h4><p>Simulates how billions of molecules behave before any lab work.</p></div><div class="mini"><h4>4. Choose patients</h4><p>Predicts who is most likely to respond in a clinical trial.</p></div></div>' +

  function viewCrispr() {
    var h = '<article class="card learn"><h3>Scissors borrowed from bacteria</h3>' +
      "<p>Bacteria are attacked by viruses (bacteriophages). Some bacteria store short snippets of virus DNA in their own genome: these repeats are the <b>CRISPR</b> region. If the same virus attacks again, the bacterium makes RNA copies of the snippets. They guide a protein, <b>Cas9</b>, to the matching virus DNA and cut it.</p>" +
      '<div class="grid2"><div class="mini"><h4>1. Find</h4><p>A guide RNA matches the target DNA sequence.</p></div><div class="mini"><h4>2. Cut</h4><p>Cas9 cuts both strands, but only next to a short tag called the <b>PAM</b> (NGG for common Cas9).</p></div><div class="mini"><h4>3. Edit</h4><p>The cell repairs the break. A quick repair often switches the gene off. If a DNA template is supplied, the cell can copy it to fix or insert a sequence.</p></div></div>' +
      "<p>Jennifer Doudna and Emmanuelle Charpentier received the 2020 Nobel Prize in Chemistry for turning this into a tool. In 2023 the first CRISPR medicine, <b>Casgevy</b>, was approved for sickle cell disease and beta-thalassaemia.</p>" +
      "<p><b>Where AI helps:</b> choosing guide RNAs that match only one place in the genome (avoiding <b>off-target</b> cuts), predicting how a cell will repair a cut, and designing new Cas proteins.</p>" +
      '<div class="callout warn"><b>Somatic or germline?</b> Editing body cells treats one patient. Editing eggs, sperm or embryos (<b>germline</b>) changes DNA that is passed to future generations, which is why it is far more controversial.</div>' +
      terms([T("CRISPR-Cas9"), T("Guide RNA"), T("PAM"), T("Off-target effect"), T("Germline editing")]) + "</article>";
    return h + qCard("q5") + a4();
  }

  function viewStructures() {

      '<p class="hint">Below are six real molecules. They come from structure files that scientists solved in labs. <b>Drag to rotate</b> them, change the colours, and read what to look for. Opened structures get a tick.</p>' + v3Html(["1A8O", "2BEG", "1LCD", "7DDO", "4CUP", "2XHE"], false) +
      '<ul class="terms"><li><b>The six, in short.</b> HIV capsid protein (1A8O): mostly α-helices that build the shell around the virus genome.</li><li><b>Amyloid-β fibril (2BEG):</b> chains stack into β-sheets. Such stacks build up in Alzheimer\'s disease.</li><li><b>Protein bound to DNA (1LCD):</b> the lac repressor, which bacteria use to switch a gene off.</li><li><b>Virus spike meets ACE2 (7DDO):</b> the key that lets the coronavirus fit a lock on human cells.</li><li><b>Protein with a drug fragment (4CUP):</b> a small molecule sitting in a pocket. Drug design starts here.</li><li><b>Two-protein complex (2XHE):</b> two proteins that work together in nerve cells.</li></ul>' +
      "<h3>Four levels of structure</h3>" +
      fig("levels", "Primary structure as a string of amino acid letters, alpha helix, beta sheet, tertiary fold and quaternary assembly", "Primary structure shows the first 16 real residues of 1A8O. Dashed green lines are hydrogen bonds.") +
      '<div class="grid2"><div class="mini"><h4>Primary</h4><p>The order of amino acids, joined by peptide bonds. It is written in the gene.</p></div><div class="mini"><h4>Secondary</h4><p>Local folds held by hydrogen bonds: the α-helix (a spring) and the β-sheet (pleated strands).</p></div><div class="mini"><h4>Tertiary</h4><p>The whole chain folds into one 3D shape, held by bonds between side chains.</p></div><div class="mini"><h4>Quaternary</h4><p>Several folded chains join into one working unit, like the four chains of haemoglobin.</p></div></div>' +

  function refreshTeacher() { if (S.view !== "teacher") return; var m = document.getElementById("main"), y = window.scrollY; m.innerHTML = viewTeacher(); window.scrollTo(0, y); }
  function removeStudents(id) {
    var ids = id === "*" ? (S.roster || []).map(function (r) { return r.id; }) : [id];
    S.rmAsk = null;
    if (S.mode === "sheet") { sheetPost(JSON.stringify({ action: "remove", key: S.teacherKey, ids: ids })); S.roster = (S.roster || []).filter(function (r) { return ids.indexOf(r.id) < 0; }); refreshTeacher(); return; }
    refreshTeacher();
    if (!db) return;
    ids.reduce(function (p, x) { return p.then(function () { return db.doc("students/" + x).delete(); }); }, Promise.resolve()).catch(function () { });
  }
  function doReset() {
    var nm = S.me.name, sc = S.me.section;
    UI.text = { nm: nm, sec: sc }; UI.a1 = { col: null, aa: "", bb: "", ok: false, tries: 0 }; UI.a4 = { off: 0, cutPick: null, cutOk: false, tries: 0, repair: null }; UI.a5 = { corner: null }; initP2();
    S.resetAsk = false; S.me = newDoc(nm, sc);
    if (S.mode === "cloud") { S.saveState = "saving"; chain = chain.then(function () { return S.ref.set(S.me); }).then(function () { S.saveState = "saved"; paintStatus(); }).catch(onSaveErr); }
    else if (S.mode === "sheet") { lsSet("aiBioLocal", JSON.stringify(S.me)); queueSheet(); }
    else if (S.mode === "local") lsSet("aiBioLocal", JSON.stringify(S.me));
    S.view = "mod"; S.mod = 0; lsSet("aiBioMod", "0"); render(); window.scrollTo(0, 0);
  }
  function openTeacher() {
    S.view = "teacher"; render();
    if (S.mode === "sheet") { loadRoster(); if (!S.pollT) S.pollT = setInterval(function () { if (S.view === "teacher") loadRoster(); else { clearInterval(S.pollT); S.pollT = null; } }, 15000); return; }
    if (!S.rosterUnsub && db) {
      S.rosterUnsub = db.collection("students").onSnapshot(function (snap) {
        S.roster = snap.docs.map(function (d) { var x = clone(d.data() || {}); x.id = d.id; return x; });
        refreshTeacher();
      }, function () { S.roster = []; if (S.view === "teacher") render(); });
    }
  }

  /* ---------------- render + events ---------------- */
  function render() {
    var fk = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-fk");
    var m = document.getElementById("main"), h = "";
    if (S.view === "boot") h = '<p class="lead">Loading…</p>';
    else if (S.view === "welcome") h = viewWelcome();
    else if (S.view === "teacher") h = viewTeacher();
    else {
      var mod = MODS[S.mod];
      h = (S.banner ? '<div class="banner">' + esc(S.banner) + "</div>" : "") + '<header><div class="eyebrow">' + esc(mod.eyebrow) + '</div><h1 class="title">' + esc(mod.title) + "</h1></header>" + VIEWS[mod.id]() +
        '<div class="pager"><button class="btn" data-act="prev"' + (S.mod === 0 ? " disabled" : "") + '>Back</button><button class="btn primary" data-act="next"' + (S.mod === MODS.length - 1 ? " disabled" : "") + ">Next: " + (S.mod < MODS.length - 1 ? esc(MODS[S.mod + 1].short) : "") + "</button></div>" +
        (S.resetAsk ? '<div class="banner"><b>Reset your progress?</b> This clears all your answers and activities so you can start again from Part 1. Your teacher will see the fresh start.<div class="row" style="margin-top:8px"><button class="btn coral" data-act="resetyes">Yes, reset</button><button class="btn" data-act="resetno">Keep my progress</button></div></div>' : '<div class="foot"><button class="btn sm" data-act="resetask">Reset my progress</button></div>');
    }
    m.innerHTML = h; header(); v3Mount();
    if (fk) { var el = document.querySelector('[data-fk="' + fk + '"]'); if (el && !el.disabled) el.focus(); }
  }
  function go(i) { if (!S.me) { S.mode = S.mode === "sheet" ? "preview" : "preview"; S.me = newDoc("Preview", ""); } S.view = "mod"; S.mod = Math.max(0, Math.min(MODS.length - 1, i)); lsSet("aiBioMod", String(S.mod)); render(); window.scrollTo(0, 0); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var act = b.getAttribute("data-act"), v = b.getAttribute("data-v"), i = +b.getAttribute("data-i");
    switch (act) {
      case "go": go(i); break;
      case "prev": go(S.mod - 1); break;
      case "next": go(S.mod + 1); break;
      case "teacher": openTeacher(); break;
      case "csv": exportCsv(); break;
      case "resetask": S.resetAsk = true; render(); break;
      case "resetno": S.resetAsk = false; render(); break;
      case "resetyes": doReset(); break;
      case "rmask": S.rmAsk = b.getAttribute("data-id"); refreshTeacher(); break;
      case "rmno": S.rmAsk = null; refreshTeacher(); break;
      case "rmyes": removeStudents(b.getAttribute("data-id")); break;
      case "start": var nm = (UI.text.nm || "").trim(); if (!nm) { document.getElementById("nm").focus(); return; } startStudent(nm.slice(0, 40), (UI.text.sec || "").trim().slice(0, 20)); break;
      case "preview": S.mode = "preview"; S.me = newDoc("Preview", ""); S.view = "mod"; S.mod = 0; render(); break;
      case "ans": answer(b.getAttribute("data-q"), i); break;
      case "a1col": if (!S.me.done.a1) { UI.a1.col = i; render(); } break;
      case "a1check":
        UI.a1.tries++;
        if (UI.a1.aa === "Glu" && UI.a1.bb === "Val") { UI.a1.ok = true; markDone("a1", { a1: { tries: UI.a1.tries } }); } else render();
        break;
      case "a2done": markDone("a2", { a2: { pick: UI.text.a2pick || "", why: (UI.text.a2why || "").slice(0, 240) } }); break;
      case "a3done": markDone("a3"); break;
      case "a4step": if (!S.me.done.a4) { UI.a4.off = Math.max(0, Math.min(14, UI.a4.off + (+v))); UI.a4.cutPick = null; UI.a4.cutOk = false; document.getElementById("a4off").value = UI.a4.off; document.getElementById("a4view").innerHTML = a4view(); } break;
      case "a4cut": UI.a4.cutPick = v; UI.a4.tries++; if (v === "before3") UI.a4.cutOk = true; document.getElementById("a4view").innerHTML = a4view(); break;
      case "a4rep": UI.a4.repair = v; markDone("a4", { a4: { tries: UI.a4.tries, repair: v } }); break;
      case "sgcheck":
        UI.sg.tries++;
        if (SG.every(function (r, k) { return UI.sg.v[k] === r[1]; })) { markDone("sg", { sg: { tries: UI.sg.tries } }); } else { UI.sg.checked = true; render(); }
        break;
      case "r5pick":
        var nn = b.getAttribute("data-n"), pk = (S.me.notes.r5 && S.me.notes.r5.picks) || {};
        if (pk[nn]) break;
        var pp = { notes: { r5: { picks: {} } } }; pp.notes.r5.picks[nn] = v; save(pp);
        pk = S.me.notes.r5.picks;
        if (DRUGS.every(function (x) { return pk[x.name]; })) { var right = DRUGS.filter(function (x) { return (pk[x.name] === "pass") === (r5reasons(x).length === 0); }).length; markDone("r5", { r5: { right: right } }); } else render();
        break;
      case "dkdone": markDone("dk", { dk: { score: dkScore(), tries: UI.dk.tries } }); break;
      case "trstep": trStep(+v); paintTr(); break;
      case "trreset": trReset(); paintTr(); break;
      case "trbias": UI.tr.biased = !UI.tr.biased; { var ob = UI.tr.biased, ol = UI.tr.lr, obest = UI.tr.best, obs = UI.tr.biasSteps; trReset(); UI.tr.biased = ob; UI.tr.lr = ol; UI.tr.best = obest; UI.tr.biasSteps = obs; } paintTr(); break;
      case "trdone": markDone("tr", { tr: { best: Math.round(UI.tr.best * 100), steps: UI.tr.steps } }); break;
      case "cbsearch": cbLookup(UI.text.cbq); break;
      case "cbchip": UI.text.cbq = v; { var qi = document.getElementById("cbq"); if (qi) qi.value = v; } cbLookup(v); break;
      case "chemblgo": UI.text.cbq = v; { var qj = document.getElementById("cbq"), sec = document.getElementById("cbsec"); if (qj) qj.value = v; if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" }); } cbLookup(v); break;
      case "cbdone": markDone("cb", { cb: { count: Object.keys(cbNames()).length } }); break;
      case "tsignin": { var kk = (UI.text.tkey || "").trim(); if (!kk) break; S.teacherKey = kk; S.isTeacher = true; try { sessionStorage.setItem("aiBioKey", kk); } catch (e) { } S.roster = null; openTeacher(); } break;
      case "trefresh": loadRoster(); break;
      case "v3io": case "v3pick": case "v3spin": case "v3zoom": case "v3reset": v3Act(act, v); break;
      case "expdone": markDone("exp", { exp: { opened: Object.keys(v3Viewed()).length } }); break;
      case "a5corner": UI.a5.corner = v; render(); break;
      case "a5done": markDone("a5", { a5: { corner: UI.a5.corner, why: (UI.text.a5why || "").slice(0, 240) } }); break;
      case "exitdone": markDone("exit", { exit: { s1: (UI.text.exs1 || "").slice(0, 240), s2: (UI.text.exs2 || "").slice(0, 240), s3: (UI.text.exs3 || "").slice(0, 240) } }); break;
    }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "a4off") { UI.a4.off = +t.value; UI.a4.cutPick = null; UI.a4.cutOk = false; document.getElementById("a4view").innerHTML = a4view(); return; }
    var v3k = t.getAttribute && t.getAttribute("data-v3");
    if (v3k === "mode") { V3.mode = t.value; v3Panels(); v3Draw(); return; }
    if (v3k === "pocket") { V3.pocket = t.checked; V3.yaw = -0.6; V3.pitch = 0.35; V3.zoom = 1; v3Panels(); v3Draw(); return; }
    var sgi = t.getAttribute && t.getAttribute("data-sg");
    if (sgi != null && sgi !== "") { UI.sg.v[+sgi] = t.value; UI.sg.checked = false; document.querySelectorAll(".sgmk").forEach(function (e) { e.textContent = ""; }); return; }
    var dki = t.getAttribute && t.getAttribute("data-dk");
    if (dki != null && dki !== "") { UI.dk.v[+dki] = +t.value; UI.dk.tries++; document.getElementById("dkview").innerHTML = dkView(); return; }
    var r5k = t.getAttribute && t.getAttribute("data-r5");
    if (r5k) { UI.r5[r5k] = +t.value; document.getElementById("r5v-" + r5k).textContent = t.value; document.getElementById("r5live").innerHTML = r5live(); return; }
    if (t.getAttribute && t.getAttribute("data-tr") === "lr") { UI.tr.lr = +t.value; return; }
    var k = t.getAttribute && t.getAttribute("data-text");
    if (k) { UI.text[k] = t.value; if (k === "a2pick") { var btn = document.querySelector('[data-act="a2done"]'); if (btn) btn.disabled = !t.value; } }
    var sel = t.getAttribute && t.getAttribute("data-sel"); if (sel) UI.a1[sel] = t.value;
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.id && (e.target.id === "nm" || e.target.id === "sec")) { e.preventDefault(); var b = document.querySelector('[data-act="start"]'); if (b) b.click(); } else if (e.key === "Enter" && e.target.id === "cbq") { e.preventDefault(); cbLookup(e.target.value); } });

  /* ---------------- boot ---------------- */
  function enterLocal(banner) {
    S.mode = "local"; if (banner) S.banner = banner;
    var raw = lsGet("aiBioLocal"), me = null; try { me = raw ? JSON.parse(raw) : null; } catch (e) { }
    if (me && me.answers) { S.me = me; S.view = "mod"; S.mod = +(lsGet("aiBioMod") || 0) || 0; } else S.view = "welcome";
    render();
  }
  async function boot() {
    render();
    if (!(typeof claude !== "undefined" && claude && typeof claude.use === "function")) { bootStandalone(); return; }
    try { userNS = await claude.use("user"); } catch (e) { userNS = null; }
    try { downloadsNS = await claude.use("downloads"); } catch (e) { downloadsNS = null; }
    try { db = await claude.use("db"); } catch (e) { db = null; }
    try { S.isTeacher = userNS ? ((await userNS.canEdit()) || (await userNS.isOwner())) : false; } catch (e) { }
    try { S.uid = userNS ? await userNS.id() : null; } catch (e) { S.uid = null; }
    if (!db || !S.uid) { enterLocal(S.isTeacher ? "" : "You are not signed in, so your progress is saved only on this device and your teacher cannot see it."); if (S.isTeacher && !db) S.banner = ""; return; }
    var canWrite = null; try { canWrite = userNS ? await userNS.can("data.write") : null; } catch (e) { }
    if (canWrite === false && !S.isTeacher) { enterLocal("You have view-only access, so your progress is saved on this device only. Ask your teacher for Contributor access so they can see your progress."); return; }
    S.mode = "cloud"; S.ref = db.doc("students/" + S.uid);
    S.ref.onSnapshot(function (snap) {
      if (S.hydrated) { if (S.saveState === "error") { S.saveState = "saved"; paintStatus(); } return; }
      S.hydrated = true;
      if (snap.exists) { S.me = clone(snap.data()); S.me.answers = S.me.answers || {}; S.me.done = S.me.done || {}; S.me.notes = S.me.notes || {}; S.view = "mod"; S.mod = +(lsGet("aiBioMod") || 0) || 0; S.saveState = "saved"; }
      else S.view = "welcome";
      render();
    }, function (err) { if (!S.hydrated) { S.hydrated = true; enterLocal("Could not reach the shared progress store, so this session is saved on this device only."); } });
    setTimeout(function () { if (!S.hydrated) { S.hydrated = true; S.view = "welcome"; render(); } }, 6000);
  }
  boot();
})();
</script>
